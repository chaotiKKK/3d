# FreeCam3D CI: serve the app over HTTP and assert the ?selftest result.
# The harness drives a real headless browser via CDP (Node >= 22 built-in
# WebSocket, no dependencies): the selftest is an async boot IIFE that sets
# document.title only after the load event, so a plain curl/--dump-dom check
# can never see it. A failing assertion exits non-zero and fails the job.
# ui-smoke is a second, independent job: Playwright walks the real UI
# (onboarding, scan recipes) on a fresh profile and uploads screenshots.
# apk is a third: the committed hand-built pipeline must keep producing a
# signed, installable shell with a byte-identical embedded webapp on every
# push (regression net for the Android side — on-device behavior itself is
# verified locally via the AVD recipe in AGENTS.md).
# apk-emulator is the fourth: boots the API-34 headless AVD with KVM and
# runs the on-emulator checks (secure context, camera bridge, MediaStore
# export, in-APK selftest 67/69) through cdp-verify.mjs — the CI mirror of
# the local AVD verification recipe.
name: selftest
on:
  push:
  pull_request:
  workflow_dispatch:

# Repeated pushes: cancel the superseded run instead of queueing behind it.
# Grouped per ref, so a push to main never cancels a pull_request run and
# vice versa (PRs get their own refs/pull/<n>/merge group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit-test the verdict policy
        run: node --test .build/verdict.test.mjs

      - name: Serve app over HTTP
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/index.html > /dev/null && break
            sleep 1
          done

      - name: Run CI selftest harness
        run: node .build/ci-selftest.mjs "http://localhost:8080/?selftest"

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium

      - name: Serve app over HTTP
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/index.html > /dev/null && break
            sleep 1
          done

      - name: Run Playwright UI smoke
        run: python3 .build/ui-smoke.py

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-shots
          path: .build/ui-shots/
          retention-days: 7

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK (hand-built pipeline, no gradle)
        run: bash .build/apk/build-apk.sh

      - name: Verify signature
        run: "$ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs FreeCam3D.apk"

      - name: Check badging + embedded webapp byte-identity
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging FreeCam3D.apk | grep -E "package:|launchable-activity|uses-permission"
          mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
          unzip -o -q "$GITHUB_WORKSPACE/FreeCam3D.apk" assets/index.html
          cmp "$GITHUB_WORKSPACE/index.html" assets/index.html && echo "index.html embedded byte-identical"

  apk-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM acceleration (required by the emulator)
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm not available — KVM is required for the emulator on hosted runners"
            exit 1
          fi
          # /dev/kvm exists but the runner user is not in the kvm group
          # ("This user doesn't have permissions to use KVM"). Canonical
          # hosted-runner fix: udev rule granting mode 0666 on the node.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install emulator + system image (sdkmanager)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null

      - name: Create + boot headless AVD
        run: |
          # Pin the AVD home for BOTH tools: newer avdmanager defaults to
          # $ANDROID_USER_HOME (~/.config/.android) while emulator 37 only
          # searches $ANDROID_AVD_HOME, $ANDROID_SDK_HOME/avd, $HOME/.android/avd
          # — unset, the emulator never finds the created AVD ("Unknown AVD name").
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n fc3d-ci -k "system-images;android-34;google_apis;x86_64" -d pixel_5 --force
          "$ANDROID_HOME/emulator/emulator" -avd fc3d-ci \
            -no-window -no-audio -no-boot-anim \
            -camera-front emulated -camera-back virtualscene \
            -gpu swiftshader_indirect -no-snapshot \
            > /tmp/emulator-ci.log 2>&1 &
          echo "emulator pid $!"
          timeout 420 bash -c 'while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 5; done' \
            || { echo "::error::emulator did not boot in 420s"; tail -30 /tmp/emulator-ci.log; exit 1; }
          echo "BOOTED"

      - name: Build APK (reuse the committed pipeline)
        run: bash .build/apk/build-apk.sh

      - name: Install APK + pre-grant camera
        run: |
          adb install -r FreeCam3D.apk
          adb shell pm grant com.freecam3d.app android.permission.CAMERA

      - name: Run on-emulator smoke (camera bridge, MediaStore export, selftest)
        run: bash .build/apk/emulator-smoke.sh

      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: /tmp/emulator-ci.log
          retention-days: 7