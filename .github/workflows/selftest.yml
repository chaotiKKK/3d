# FreeCam3D CI: serve the app over HTTP and assert the ?selftest result.
# The harness drives a real headless browser via CDP (Node >= 22 built-in
# WebSocket, no dependencies): the selftest is an async boot IIFE that sets
# document.title only after the load event, so a plain curl/--dump-dom check
# can never see it. A failing assertion exits non-zero and fails the job.
# ui-smoke is a second, independent job: Playwright walks the real UI
# (onboarding, scan recipes) on a fresh profile and uploads screenshots.
# apk is a third: the committed hand-built pipeline must keep producing a
# signed, installable shell with a byte-identical embedded webapp on every
# push (regression net for the Android side — on-device behavior itself is
# verified locally via the AVD recipe in AGENTS.md).
name: selftest
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit-test the verdict policy
        run: node --test .build/verdict.test.mjs

      - name: Serve app over HTTP
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/index.html > /dev/null && break
            sleep 1
          done

      - name: Run CI selftest harness
        run: node .build/ci-selftest.mjs "http://localhost:8080/?selftest"

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium

      - name: Serve app over HTTP
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/index.html > /dev/null && break
            sleep 1
          done

      - name: Run Playwright UI smoke
        run: python3 .build/ui-smoke.py

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-shots
          path: .build/ui-shots/
          retention-days: 7

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK (hand-built pipeline, no gradle)
        run: bash .build/apk/build-apk.sh

      - name: Verify signature
        run: "$ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs FreeCam3D.apk"

      - name: Check badging + embedded webapp byte-identity
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging FreeCam3D.apk | grep -E "package:|launchable-activity|uses-permission"
          mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
          unzip -o -q "$GITHUB_WORKSPACE/FreeCam3D.apk" assets/index.html
          cmp "$GITHUB_WORKSPACE/index.html" assets/index.html && echo "index.html embedded byte-identical"